name: Calculator CI

on: [push]

jobs:
  test-calculator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calculator
        run: python calculator.py

      - name: Run unit tests
        run: python -m unittest -v